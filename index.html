<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pencil</title>
<style>
* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  background: black;
  font-family: Arial, sans-serif;
}

#button {
  width: 150px;
  text-align: center;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.pencil {
  position: relative;
  width: 70px;
  height: 230px;
  margin: 0 auto;
  overflow: hidden;
}

.body {
  position: absolute;
  left: 9px;
  top: 38px;
  width: 52px;
  height: 145px;
  background: #ffd84d;
  border: 2px solid #c99d00;
}

.body::before,
.body::after {
  content: "";
  position: absolute;
  top: 0;
  width: 7px;
  height: 100%;
  background: rgba(255,255,255,.28);
}

.body::before { left: 7px; }
.body::after { right: 7px; }

.eraser {
  position: absolute;
  left: 9px;
  top: 8px;
  width: 52px;
  height: 30px;
  background: #f28b82;
  border: 2px solid #c85f59;
  border-radius: 7px 7px 3px 3px;
  z-index: 2;
}

.band {
  position: absolute;
  left: 9px;
  top: 38px;
  width: 52px;
  height: 16px;
  background: linear-gradient(90deg,#999,#eee,#aaa,#f5f5f5,#999);
  border: 1px solid #888;
  z-index: 3;
}

.tip {
  position: absolute;
  left: 9px;
  top: 183px;
  width: 52px;
  height: 45px;
  background: #e6b27f;
  border-left: 2px solid #b77743;
  border-right: 2px solid #b77743;
  clip-path: polygon(0 0,100% 0,50% 100%);
  z-index: 2;
}

.lead {
  position: absolute;
  left: 29px;
  top: 207px;
  width: 12px;
  height: 23px;
  background: #333;
  clip-path: polygon(0 0,100% 0,50% 100%);
  z-index: 4;
}

.pencil::after {
  content: "";
  position: absolute;
  top: 225px;
  left: -75px;
  width: 16px;
  height: 300px;
  background: rgba(255,255,255,.95);
  transform: rotate(45deg);
  opacity: 0;
  pointer-events: none;
  z-index: 20;
}

.pencil.shine::after {
  animation: shineSweep 1.4s linear;
}

@keyframes shineSweep {
  0% { top: 225px; left: -75px; opacity: 0; }
  12% { opacity: 1; }
  100% { top: -80px; left: 60px; opacity: 0; }
}

.name {
  margin-top: 14px;
  font-size: 30px;
  font-weight: bold;
  color: orange;
  transition: none;
}

.name.flash {
  color: white;
}
</style>
</head>

<body>
<div id="button" role="button" aria-label="Pencil">
  <div class="pencil" id="pencil">
    <div class="eraser"></div>
    <div class="band"></div>
    <div class="body"></div>
    <div class="tip"></div>
    <div class="lead"></div>
  </div>
  <div class="name" id="name">Pencil</div>
</div>

<script>
const button = document.getElementById("button");
const pencil = document.getElementById("pencil");
const name = document.getElementById("name");

function activate() {
  name.classList.remove("flash");
  pencil.classList.remove("shine");

  void name.offsetWidth;
  void pencil.offsetWidth;

  name.classList.add("flash");
  pencil.classList.add("shine");

  setTimeout(() => name.classList.remove("flash"), 500);
  setTimeout(() => pencil.classList.remove("shine"), 1500);
}

button.addEventListener("pointerdown", activate);
</script>
</body>
</html>
